// Our own methods, for end-to-end encryption on MLS (2bytes #36).
//
// Kept in a file of its own rather than added to the generated schema, so that
// regenerating that schema from upstream cannot quietly drop them, and so that
// updating this module has exactly one file to carry across.
//
// The wire encoding these types use towards the phone is written by hand in
// mls.go - MTProto, not protobuf. This file exists because the services inside
// the server talk protobuf to each other, and a type that is not a protobuf
// message cannot make that hop.

syntax = "proto3";

package mtproto;

option go_package = "github.com/teamgram/proto/mtproto";

// A device leaving a supply of key packages, so that somebody can start a
// conversation with it while it is asleep.
message TL_mls_publishKeyPackages {
  repeated bytes key_packages = 1;
  // May be empty. When it is not, it is the one package handed out repeatedly
  // once the supply runs dry - the weaker path, taken so that a conversation
  // can still start.
  bytes last_resort = 2;
  // The leaf name of the identity these belong to.
  //
  // A device that starts its state over makes a new identity, and the packages
  // it published under the old one stay here. The server counts a device's
  // supply by its auth key, so it sees a full one, never asks for more, and
  // everybody who starts a conversation with that person builds an invitation
  // the person can never open (#136).
  bytes name = 3;
}

// What was taken, and whether the device should make more. The decision to
// refill stays with the only party that can make packages.
message mls_PublishResult {
  int32 added = 1;
  int32 available = 2;
  bool should_refill = 3;
  // How many devices of this account have published anything. It is what tells
  // a phone that another phone of the same person has signed in since a
  // conversation started (#41).
  int32 devices = 4;
}

// Asks for one package per device of a person, which is what starting a
// conversation with them needs: each device is a member of its own.
message TL_mls_claimKeyPackages {
  int64 user_id = 1;
}

// One package per device that had something. A device with nothing left is
// missing from here rather than failing the request - one silent device must
// not stop a conversation with the rest.
message mls_KeyPackages {
  repeated bytes packages = 1;
}

// A welcome is what lets a device into a conversation somebody started with it.
//
// It travels here rather than as a message, so that no client has to hide
// anything from a chat list: handshake traffic never touches the message
// pipeline at all. The server holds each one until the device says it has read
// it - a welcome lost in transit is a conversation that exists on one side and
// not the other, which shows up much later as messages that will not open.
message TL_mls_sendWelcome {
  int64 user_id = 1;
  bytes welcome = 2;
  // Which chat the invitation is for, as a dialog id - negative for a group,
  // positive for a person. A dialog id and not either client's internal packed
  // form: the two clients pack them differently, and one reading the other's
  // packing crashed on the path every invitation takes.
  // Without it a welcome says only who sent it, and the device joining files
  // the conversation under that person: a group ends up recorded as the
  // conversation with whoever invited them, and a private message to that
  // person is then written with the group's keys (#115).
  int64 peer_id = 3;
}

message TL_mls_getWelcomes {}

// Ours rather than the schema's Bool, so this file needs nothing from the
// generated schema and survives its regeneration untouched.
message mls_Ok {
  bool ok = 1;
}

message mls_Welcome {
  int64 id = 1;
  int64 from_id = 2;
  bytes welcome = 3;
  // The chat this invitation is for. Zero for one written before invitations
  // carried it, and then the old guess - the sender - is all there is.
  int64 peer_id = 4;
}

message mls_Welcomes {
  repeated mls_Welcome welcomes = 1;
}

// Read is not the same as delivered. A device confirms only after the
// conversation is open and saved, so a crash in between costs a retry rather
// than the conversation.
message TL_mls_confirmWelcomes {
  repeated int64 ids = 1;
}

// A commit is what moves a conversation from one epoch to the next: somebody
// added, somebody removed. MLS validates it against the epoch it was made from,
// so of two commits made from the same epoch exactly one can be taken - the
// server keeps that order, which RFC 9420 gives to the delivery service.
//
// The members are named because the server does not know who is in a group and
// must not: it is told where to leave the commit, not asked who belongs.
message TL_mls_sendCommit {
  bytes group_id = 1;
  int64 epoch = 2;
  repeated int64 members = 3;
  bytes commit = 4;
  // Who holds a leaf in this group once this commit is applied - one entry per
  // leaf, each the leaf's identity exactly as MLS carries it, which in this
  // fork is the bytes of <user_id>/<device_id>. The committer is the one party
  // that knows for certain: it is that device's own tree and it has just
  // changed it.
  //
  // Whole rather than incremental, and that is the point: any commit repairs
  // the roster, an addition and a removal are the same operation, and a server
  // that missed one is corrected by the next rather than staying wrong for
  // ever (#147).
  repeated bytes holds = 5;
}

// Whether the commit was taken, and which epoch the conversation is really on.
//
// The epoch comes back on refusal as well, so the loser of a race knows how far
// behind it is without another round trip - it has to catch up, rebuild its
// change on top of the winner and send again.
message mls_CommitResult {
  bool accepted = 1;
  int64 epoch = 2;
}

message TL_mls_getCommits {}

message mls_Commit {
  int64 id = 1;
  int64 from_id = 2;
  bytes group_id = 3;
  int64 epoch = 4;
  bytes commit = 5;
}

message mls_Commits {
  repeated mls_Commit commits = 1;
}

// Applied, not received. A device that took a commit and stopped before saving
// the state it produced must be given it again, or it sits an epoch behind and
// the conversation goes quiet for that person alone.
message TL_mls_confirmCommits {
  repeated int64 ids = 1;
}

// How many devices each of these people has published from.
//
// Everything that compares a conversation with its chat reads the part of a
// leaf name before the slash, so it reasons about people. That is wrong the
// moment somebody replaces a phone: the leaf of the device that is gone still
// stands for them, nobody counts them as missing, and the phone they now hold
// is never let in - they sit in the chat watching padlocks for ever (#132).
//
// A count is what tells the difference, and only the server can give it: it is
// the one that knows how many devices a person has published from. Asking for
// key packages would answer the same question and spend one to do it - a claim
// is a delete - so the supply would be gone within the hour.
//
// Nothing is learnt from the answer that the group does not already show:
// everybody in a conversation can see everybody's leaves.
message TL_mls_devicesOf {
  repeated int64 users = 1;
}

// One count per person asked about, in the order they were asked, and the name
// of every one of those devices after it.
//
// The names run as one list rather than one list per person: TL has no ragged
// vector, and the counts already say where to cut. That is the point of putting
// them in one answer - a leaf is taken out on two questions, whether a device
// is missing (the count) and which leaf is it (the names), and while those came
// from two calls they could disagree. Nobody dared act on them for anybody but
// their own account, so a leaf whose device is gone stayed for ever and every
// commit was encrypted to it (#139).
//
// A name may be empty: a device that published before key packages said which
// identity they belong to (#136) is counted and cannot be named. It is still
// one entry, so the cut stays right, and a caller that finds an empty name
// knows this person has a device it cannot account for and must not decide
// anything about their leaves.
message mls_DeviceCounts {
  repeated int32 counts = 1;
  repeated bytes names = 2;
}

// A device saying it has started the conversation for a chat.
//
// Nothing decided which conversation a chat's is, so every device that wanted
// to send into one without a conversation started one of its own - and three
// people beginning a group within a minute ended in two conversations that
// cannot read each other (#135). Devices cannot settle it among themselves:
// the losers have to be told, and when everybody is offline and arrives in a
// random order there is nobody to tell them.
//
// So the first claim wins, and the answer is the same for everybody from then
// on. A device whose claim loses throws its own away and waits: it is in the
// chat, and the members of the conversation that won will see it has no leaf
// there and let it in.
//
// holds_everybody is the other thing a device can say here, and the only thing
// that may replace an answer already settled: that it is itself inside this
// conversation and has just found a leaf there for every device of every member
// of the chat. Nothing else makes a conversation the chat's, and a device that
// has just compared the two knows it as a fact rather than a hope.
//
// It is needed because the first answer was otherwise for ever. The answer for
// one chat on the stand was won by a conversation a rebuilding device made and
// nobody followed: everybody talks in another one, and every device that starts
// from nothing is sent to a group with nobody in it, to wait for an invitation
// that cannot come. No message and no invitation can undo that, because neither
// of them is ever compared with what is settled here (#139).
//
// It grants nobody anything they did not have. A member can already take the
// chat into a conversation of their own by inviting everybody to it; this only
// writes down where the chat ended up.
message TL_mls_claimConversation {
  int64 peer_id = 1;
  bytes group_id = 2;
  bool holds_everybody = 3;
  // The same roster as on a commit, because a group's first membership arrives
  // with no commit at all: the creator accepts its own commit locally and never
  // posts it, deliberately - there is nobody to have raced with (#147).
  repeated bytes holds = 4;
}

// The conversation this chat has, which is the claimant's own when it was
// first and somebody else's when it was not.
message mls_Conversation {
  int64 peer_id = 1;
  bytes group_id = 2;
}

service RPCMls {
  rpc mls_publishKeyPackages(TL_mls_publishKeyPackages)
      returns (mls_PublishResult) {}
  rpc mls_claimKeyPackages(TL_mls_claimKeyPackages)
      returns (mls_KeyPackages) {}
  rpc mls_sendWelcome(TL_mls_sendWelcome) returns (mls_Ok) {}
  rpc mls_getWelcomes(TL_mls_getWelcomes) returns (mls_Welcomes) {}
  rpc mls_confirmWelcomes(TL_mls_confirmWelcomes) returns (mls_Ok) {}
  rpc mls_setRecoverySecret(TL_mls_setRecoverySecret) returns (mls_Ok) {}
  rpc mls_sendCommit(TL_mls_sendCommit) returns (mls_CommitResult) {}
  rpc mls_getCommits(TL_mls_getCommits) returns (mls_Commits) {}
  rpc mls_confirmCommits(TL_mls_confirmCommits) returns (mls_Ok) {}
  rpc mls_devicesOf(TL_mls_devicesOf) returns (mls_DeviceCounts) {}
  rpc mls_claimConversation(TL_mls_claimConversation) returns (mls_Conversation) {}
}

// A device registering the way back into its own account.
//
// What arrives is not the recovery phrase: it is a one-way derivation of the
// words, made on the phone. The words are made there too and never travel,
// because a phrase signs in without a code - it is the whole account - and the
// server holding a copy of one is the server holding the account.
//
// It also decides whether an encrypted history backup means anything: the
// backup key comes from the same words by a different derivation, so a server
// that never sees the words cannot read the backup either.
message TL_mls_setRecoverySecret {
  string secret = 1;
}
